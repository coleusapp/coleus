services:
  app:
    image: coleus/coleus:latest
    volumes:
      - ./.env:/app/.env
      - ./storage:/app/storage
    ports:
      - "80:8000"
    depends_on:
      - db
    networks:
      - app
  queue:
    image: coleus/coleus:latest
    command: php artisan queue:work --tries=3
    volumes:
      - ./.env:/app/.env
      - ./storage:/app/storage
    depends_on:
      - db
    networks:
      - app
    restart: unless-stopped
  db:
    image: mariadb:10.11
    environment:
      - MARIADB_ROOT_PASSWORD=secret
      - MARIADB_DATABASE=coleus
      - MARIADB_USER=user
      - MARIADB_PASSWORD=secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app
networks:
  app:
volumes:
  db_data:
